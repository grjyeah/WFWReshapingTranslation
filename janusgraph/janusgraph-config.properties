# JanusGraph 配置文件
# 用于本地部署：Cassandra + Elasticsearch

# 存储后端配置
storage.backend=cql
storage.hostname=127.0.0.1
storage.port=9042
# Cassandra keyspace（会自动创建）
storage.cql.keyspace=meeting_graph
# 数据持久化
storage.directory=D:/pyworkspace/WFWReshapingTranslation/janusgraph/data

# 索引后端配置
index.search.backend=elasticsearch
index.search.hostname=127.0.0.1
index.search.port=9200
# Elasticsearch 索引名称
index.search.index-name=meeting_graph_fulltext

# 缓存配置
cache.db-cache=true
cache.db-cache-size=0.5
cache.db-cache-time=180000

# 图级别配置
graph.set-vertex-id=true
graph.allow-traversal-log-results=true

# 查询优化
query.fast-property=true

# 事务配置
tx.log-tx=true
tx.max-commit-time=300

# 日志级别
log.level=INFO
